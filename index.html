<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/img/ngite_space_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ngite Space Limited bridges Ugandan producers, international traders and climate practitioners — sustainable sourcing, EUDR compliance, GIS farm mapping and cleaner production across coffee and cocoa value chains." />

    <!-- Fonts and icons: linked (not CSS @import) so the connection starts during HTML parse instead of after app.css arrives -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- The logo is above the fold on every page; hero slides are not, so they are not preloaded here -->
    <link rel="preload" href="/assets/img/ngite_space_logo.png" as="image" />

    <!-- Open Graph / Facebook / LinkedIn. Prerendered pages rewrite these per route via @unhead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ngite Space Limited" />
    <meta property="og:title" content="Ngite Space Limited — Greener Coffee & Cocoa Value Chains in Uganda" />
    <meta property="og:description" content="Ngite Space Limited bridges Ugandan producers, international traders and climate practitioners — sustainable sourcing, EUDR compliance, GIS farm mapping and cleaner production across coffee and cocoa value chains." />
    <meta property="og:image" content="https://ngitespace.com/assets/img/image_2.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="683" />
    <meta property="og:url" content="https://ngitespace.com/" />
    <meta property="og:locale" content="en_UG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ngite Space Limited — Greener Coffee & Cocoa Value Chains in Uganda" />
    <meta name="twitter:description" content="Ngite Space Limited bridges Ugandan producers, international traders and climate practitioners — sustainable sourcing, EUDR compliance, GIS farm mapping and cleaner production across coffee and cocoa value chains." />
    <meta name="twitter:image" content="https://ngitespace.com/assets/img/image_2.jpg" />

    <title>Ngite Space Limited — Greener Coffee & Cocoa Value Chains in Uganda</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
